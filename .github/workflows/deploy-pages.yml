name: Deploy para GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões exigidas pelo deploy oficial do Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela a que já está rodando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Project page em subpasta. Para migrar depois para domínio próprio ou
      # Cloudflare, estas três variáveis são a única coisa que muda:
      # SITE_URL vira o domínio, BASE_PATH fica vazio, NOINDEX sai.
      NEXT_PUBLIC_SITE_URL: https://ibatitude.github.io/atrios-editora
      NEXT_PUBLIC_BASE_PATH: /atrios-editora
      # Endereço temporário: não deixamos o Google indexar URLs que serão
      # abandonadas quando o domínio próprio entrar. Remova ao tornar definitivo.
      NEXT_PUBLIC_NOINDEX: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Portões de qualidade: o build não roda lint nem types por conta própria
      # desde que o Next 16 removeu isso do `next build`.
      - run: npm run typecheck
      - run: npm run lint

      # Gera out/ e roda o postbuild (payloads de prefetch + .nojekyll).
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
